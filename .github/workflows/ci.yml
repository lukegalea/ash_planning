name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      SHELL: /bin/sh
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.20.4"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      # dev env: the ETS test hosts (test env) legitimately warn about identity pre_check_with.
      - run: MIX_ENV=dev mix compile --warnings-as-errors
      - run: mix test
      - run: mix planning.boundary

  # Dependency security gates (AST-181 H-03). `mix hex.audit` checks the lock
  # against Hex retirements and advisories; `mix_audit` reads its own
  # advisory database, and the two have disagreed (SDLC-96), so both run.
  # mix_audit is installed as an escript so the package's mix.exs and lock
  # stay untouched.
  audit:
    name: hex.audit + deps.audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.20.4"
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix escript.install --force hex mix_audit
      - run: ~/.mix/escripts/mix_audit
