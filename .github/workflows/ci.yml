name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      SHELL: /bin/sh
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      # dev env: the ETS test hosts (test env) legitimately warn about identity pre_check_with.
      - run: MIX_ENV=dev mix compile --warnings-as-errors
      - run: mix test
      - run: mix planning.boundary
